<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img">
  <title>Proposed egress boundary for a local-first coding agent</title>
  <desc>Proposed design, not an existing Inkling or Vectoree feature. Inside a workstation, a repository feeds a local file tool, then Inkling 2 Mini, then an application tool dispatcher. A green loop returns file edits to the repository without leaving. On the perimeter, an application-owned egress check reviews destination, payload, and task permission. An amber arrow may pass through that check to hosted search or a hosted model. A gray arrow stops at a bar inside the workstation. A thin telemetry trace also passes through the same check instead of leaving unreviewed.</desc>
  <defs>
    <marker id="go-green" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L17,9 L1,17 Z" fill="#29755C"/>
    </marker>
    <marker id="go-amber" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L19,10 L1,19 Z" fill="#BE7835"/>
    </marker>
    <marker id="go-gray" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L17,9 L1,17 Z" fill="#6E6A62"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#F6F3EA"/>
  <text x="1564" y="48" fill="#BE7835" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="800" letter-spacing="1.2" text-anchor="end">PROPOSED DESIGN</text>

  <rect x="1256" y="72" width="308" height="808" rx="22" fill="#E4E0D6"/>
  <rect x="1276" y="104" width="268" height="292" rx="16" fill="#FBF8F1" stroke="#172522" stroke-width="4"/>
  <text x="1410" y="180" fill="#172522" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" text-anchor="middle">HOSTED</text>
  <text x="1410" y="230" fill="#172522" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" text-anchor="middle">SEARCH</text>
  <text x="1410" y="286" fill="#29755C" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle">e.g. Vectoree</text>
  <text x="1410" y="324" fill="#29755C" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle">Tool Hub</text>
  <rect x="1316" y="348" width="188" height="16" rx="5" fill="#E4E0D6"/>
  <rect x="1316" y="374" width="140" height="16" rx="5" fill="#E4E0D6"/>

  <rect x="1276" y="448" width="268" height="228" rx="16" fill="#FBF8F1" stroke="#172522" stroke-width="4"/>
  <text x="1410" y="546" fill="#172522" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" text-anchor="middle">HOSTED</text>
  <text x="1410" y="596" fill="#172522" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" text-anchor="middle">MODEL</text>

  <rect x="32" y="72" width="1040" height="808" rx="22" fill="#E7F3EC" stroke="#29755C" stroke-width="5" stroke-dasharray="16 12"/>
  <text x="196" y="142" fill="#172522" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="800">WORKSTATION /</text>
  <text x="196" y="194" fill="#29755C" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="800">CONTROLLED ENVIRONMENT</text>

  <path d="M196,600 H88 V259 H188" fill="none" stroke="#29755C" stroke-width="8" stroke-linejoin="round" marker-end="url(#go-green)"/>
  <text x="98" y="392" fill="#29755C" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="800">FILE</text>
  <text x="98" y="430" fill="#29755C" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="800">EDITS</text>

  <rect x="196" y="220" width="400" height="78" rx="14" fill="#FBF8F1" stroke="#172522" stroke-width="4"/>
  <text x="396" y="268" fill="#172522" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" text-anchor="middle">REPOSITORY</text>
  <line x1="396" y1="298" x2="396" y2="334" stroke="#29755C" stroke-width="8" marker-end="url(#go-green)"/>

  <rect x="196" y="342" width="400" height="78" rx="14" fill="#FBF8F1" stroke="#172522" stroke-width="4"/>
  <text x="396" y="390" fill="#172522" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" text-anchor="middle">LOCAL FILE TOOL</text>
  <line x1="396" y1="420" x2="396" y2="456" stroke="#29755C" stroke-width="8" marker-end="url(#go-green)"/>

  <rect x="196" y="464" width="400" height="78" rx="14" fill="#29755C" stroke="#172522" stroke-width="4"/>
  <text x="396" y="512" fill="#F6F3EA" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" text-anchor="middle">INKLING 2 MINI</text>
  <line x1="396" y1="542" x2="396" y2="578" stroke="#29755C" stroke-width="8" marker-end="url(#go-green)"/>

  <rect x="196" y="586" width="400" height="108" rx="14" fill="#FBF8F1" stroke="#172522" stroke-width="4"/>
  <text x="396" y="636" fill="#172522" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="800" text-anchor="middle">APPLICATION</text>
  <text x="396" y="674" fill="#172522" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="800" text-anchor="middle">TOOL DISPATCHER</text>

  <line x1="280" y1="770" x2="688" y2="770" stroke="#6E6A62" stroke-width="8"/>
  <line x1="712" y1="738" x2="712" y2="802" stroke="#6E6A62" stroke-width="14" stroke-linecap="round"/>
  <path d="M692,750 L732,790 M732,750 L692,790" fill="none" stroke="#6E6A62" stroke-width="6" stroke-linecap="round"/>
  <text x="470" y="754" fill="#6E6A62" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="800" text-anchor="middle">DENIED</text>

  <text x="48" y="824" fill="#172522" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="800">TELEMETRY: AUDIT SEPARATELY</text>

  <rect x="792" y="328" width="392" height="468" rx="18" fill="#F6F3EA" stroke="#172522" stroke-width="7"/>
  <text x="988" y="430" fill="#172522" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" text-anchor="middle">APP-OWNED</text>
  <text x="988" y="484" fill="#172522" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" text-anchor="middle">EGRESS CHECK</text>

  <path d="M596,600 H700 V560 H1216 V240 H1270" fill="none" stroke="#BE7835" stroke-width="12" stroke-linejoin="round" marker-end="url(#go-amber)"/>
  <path d="M1216,560 H1270" fill="none" stroke="#BE7835" stroke-width="12" stroke-linejoin="round" marker-end="url(#go-amber)"/>
  <path d="M48,848 H816 V590 H1120" fill="none" stroke="#172522" stroke-width="4" stroke-linejoin="round"/>

  <text x="856" y="684" fill="#172522" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700">Destination</text>
  <text x="856" y="722" fill="#172522" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700">+ exact payload</text>
  <text x="856" y="760" fill="#172522" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700">+ task permission</text>

  <line x1="40" y1="952" x2="120" y2="952" stroke="#29755C" stroke-width="10" stroke-linecap="round"/>
  <text x="136" y="964" fill="#172522" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700">Stays local</text>
  <line x1="420" y1="952" x2="500" y2="952" stroke="#BE7835" stroke-width="10" stroke-linecap="round"/>
  <text x="516" y="964" fill="#172522" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700">Approved remote request</text>
  <line x1="1060" y1="952" x2="1128" y2="952" stroke="#6E6A62" stroke-width="10" stroke-linecap="round"/>
  <path d="M1142,936 L1170,968 M1170,936 L1142,968" fill="none" stroke="#6E6A62" stroke-width="6" stroke-linecap="round"/>
  <text x="1186" y="964" fill="#172522" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700">Denied</text>
</svg>
