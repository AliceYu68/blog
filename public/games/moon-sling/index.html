<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <title>Moon Sling</title>
  <meta name="description" content="Bend a pebble around a moon and through the hoops. A one-file canvas game.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #101010; overflow: hidden; touch-action: none; color: #f4efe2; }
    body { font-family: ui-sans-serif, system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    a.brand {
      position: fixed; z-index: 4; top: 12px; left: 14px;
      color: #d8ff00; background: rgba(16,16,16,.72); text-decoration: none;
      font-weight: 700; font-size: 12px; letter-spacing: .04em; padding: 7px 9px;
    }
    a.brand:hover, a.brand:focus-visible { background: #d8ff00; color: #101010; }
    button:focus-visible, a:focus-visible { outline: 2px solid #d8ff00; outline-offset: 3px; }
    #hud { position: fixed; z-index: 4; top: 12px; right: 14px; text-align: right; font-weight: 700; }
    #hud b { display: block; font-size: 28px; font-variant-numeric: tabular-nums; }
    #hud span { font-size: 13px; color: #d8d4c6; }
    #overlay {
      position: fixed; inset: 0; z-index: 6; display: grid; place-items: center; padding: 24px;
      background: rgba(8,8,8,.35);
    }
    #overlay[hidden] { display: none; }
    .card { width: min(460px, 100%); background: rgba(16,16,16,.9); border: 1px solid rgba(216,255,0,.5); padding: 26px 24px 18px; }
    .eyebrow { margin: 0 0 8px; letter-spacing: .14em; text-transform: uppercase; font-size: 12px; color: #d8ff00; }
    h1 { margin: 0 0 8px; font-size: clamp(42px, 8vw, 68px); line-height: .95; letter-spacing: -.04em; }
    p { margin: 0 0 8px; line-height: 1.45; }
    button {
      appearance: none; border: 0; cursor: pointer; background: #d8ff00; color: #101010;
      font: 700 16px/1 ui-sans-serif, system-ui, sans-serif; padding: 14px 18px; min-height: 48px; margin-top: 8px;
    }
    .links a { color: #f4efe2; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <a class="brand" href="https://vectoree.ai">Built with Vectoree</a>
  <div id="hud"><b id="score">0</b><span id="meta">5 shots · 0/4 hoops</span></div>
  <div id="overlay">
    <div class="card">
      <p class="eyebrow">Five shots</p>
      <h1 id="title">Moon Sling</h1>
      <p id="blurb">The moon pulls every shot. Bend the pebble through the four hoops.</p>
      <p>Drag back from the pad and release. Or aim with the arrow keys and fire with Space.</p>
      <button id="go" type="button">Sling</button>
      <p class="links"><a href="/games/">All games</a> · <a href="/posts/moon-sling-one-file-browser-game/">How it was built</a></p>
    </div>
  </div>
  <p id="live" class="sr" aria-live="polite"></p>
  <script>
    (function () {
      const W = 1000;
      const H = 640;
      const MOON = { x: 520, y: 300, r: 52 };
      const GM = 7200000;
      const PAD = { x: 156, y: 518 };
      const PR = 8;
      const SHOTS = 5;
      const BEST_KEY = 'vectoree-moon-sling-best';
      const HOOP_DEF = [
        { x: 780, y: 168, r: 34 },
        { x: 834, y: 412, r: 32 },
        { x: 318, y: 148, r: 30 },
        { x: 246, y: 332, r: 28 }
      ];
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      const overlay = document.getElementById('overlay');
      const go = document.getElementById('go');
      const blurb = document.getElementById('blurb');
      const scoreEl = document.getElementById('score');
      const metaEl = document.getElementById('meta');
      const live = document.getElementById('live');

      let view = { s: 1, ox: 0, oy: 0, w: 1, h: 1 };
      let hoops = [];
      let state = 'title';
      let score = 0;
      let shots = SHOTS;
      let aim = -1.05;
      let power = 240;
      let pulling = false;
      let pull = { x: PAD.x, y: PAD.y };
      let pebble = null;
      let trail = [];
      let audio;
      const stars = [];
      for (let i = 0; i < 80; i++) {
        stars.push({ x: (i * 127) % W, y: (i * 89) % H, r: (i % 3) * 0.4 + 0.6 });
      }

      function freshHoops() {
        hoops = HOOP_DEF.map(function (h) { return { x: h.x, y: h.y, r: h.r, got: false }; });
      }
      function readBest() {
        try { return Number(localStorage.getItem(BEST_KEY) || 0); } catch (e) { return 0; }
      }
      function writeBest(n) {
        try { localStorage.setItem(BEST_KEY, String(n)); } catch (e) { /* ignore */ }
      }
      function tone(freq, dur) {
        try {
          audio = audio || new AudioContext();
          if (audio.state === 'suspended') audio.resume();
          const o = audio.createOscillator();
          const g = audio.createGain();
          o.type = 'triangle';
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.04, audio.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
          o.connect(g); g.connect(audio.destination);
          o.start(); o.stop(audio.currentTime + dur);
        } catch (e) { /* optional */ }
      }
      function layout() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        view.w = window.innerWidth;
        view.h = window.innerHeight;
        canvas.width = Math.floor(view.w * dpr);
        canvas.height = Math.floor(view.h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        view.s = Math.min(view.w / W, view.h / H);
        view.ox = (view.w - W * view.s) / 2;
        view.oy = (view.h - H * view.s) / 2;
      }
      function worldFromEvent(e) {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left - view.ox) / view.s;
        const y = (e.clientY - rect.top - view.oy) / view.s;
        return { x: x, y: y };
      }
      function accel(x, y) {
        const dx = MOON.x - x;
        const dy = MOON.y - y;
        const d2 = dx * dx + dy * dy;
        const d = Math.sqrt(d2) || 1;
        const a = GM / d2;
        return { x: a * dx / d, y: a * dy / d };
      }
      function preview() {
        const origin = pulling ? pull : {
          x: PAD.x - Math.cos(aim) * (power / 2.35),
          y: PAD.y - Math.sin(aim) * (power / 2.35)
        };
        const v = launchVelocity(origin);
        let x = PAD.x;
        let y = PAD.y;
        let vx = v.x;
        let vy = v.y;
        const pts = [{ x: x, y: y }];
        const step = 1 / 45;
        for (let i = 0; i < 150; i++) {
          const a = accel(x, y);
          vx += a.x * step;
          vy += a.y * step;
          x += vx * step;
          y += vy * step;
          if (i % 2 === 0) pts.push({ x: x, y: y });
          if (Math.hypot(x - MOON.x, y - MOON.y) < MOON.r + PR) break;
          if (x < -80 || x > W + 80 || y < -80 || y > H + 80) break;
        }
        return pts;
      }
      function launchVelocity(from) {
        let vx = (PAD.x - from.x) * 2.35;
        let vy = (PAD.y - from.y) * 2.35;
        const sp = Math.hypot(vx, vy);
        const cap = 460;
        if (sp > cap) { vx = vx / sp * cap; vy = vy / sp * cap; }
        return { x: vx, y: vy };
      }
      function gotCount() {
        return hoops.reduce(function (n, h) { return n + (h.got ? 1 : 0); }, 0);
      }
      function paintHud() {
        scoreEl.textContent = String(score);
        metaEl.textContent = shots + ' shot' + (shots === 1 ? '' : 's') + ' · ' + gotCount() + '/4 hoops';
      }
      function show(body, label) {
        blurb.textContent = body;
        go.textContent = label;
        overlay.hidden = false;
        go.focus();
      }
      function finish() {
        state = 'done';
        const best = readBest();
        if (score > best) writeBest(score);
        show(gotCount() + ' of 4 hoops. Score ' + score + '. Best ' + Math.max(best, score) + '.', 'Sling again');
        live.textContent = 'Round over. Score ' + score + '.';
      }
      function start() {
        freshHoops();
        score = 0;
        shots = SHOTS;
        pebble = null;
        trail = [];
        pulling = false;
        aim = -1.05;
        power = 240;
        state = 'aim';
        overlay.hidden = true;
        paintHud();
        live.textContent = 'Five shots. Thread the hoops.';
        try { audio = audio || new AudioContext(); if (audio.state === 'suspended') audio.resume(); } catch (e) {}
      }
      function fireFrom(from) {
        if (state !== 'aim' || shots <= 0) return;
        const v = launchVelocity(from);
        if (Math.hypot(v.x, v.y) < 40) return;
        pebble = { x: PAD.x, y: PAD.y, vx: v.x, vy: v.y, t: 0, scored: 0 };
        trail = [{ x: PAD.x, y: PAD.y }];
        shots -= 1;
        state = 'flight';
        pulling = false;
        tone(220, 0.08);
        paintHud();
      }
      function endFlight(reason) {
        pebble = null;
        trail = [];
        if (gotCount() === hoops.length || shots <= 0) finish();
        else {
          state = 'aim';
          live.textContent = reason === 'moon' ? 'Hit the moon.' : 'Shot spent.';
        }
      }

      go.addEventListener('click', function () { if (state !== 'flight') start(); });
      canvas.addEventListener('pointerdown', function (e) {
        if (state !== 'aim') return;
        const p = worldFromEvent(e);
        if (Math.hypot(p.x - PAD.x, p.y - PAD.y) > 150) return;
        pulling = true;
        pull = p;
        canvas.setPointerCapture(e.pointerId);
      });
      canvas.addEventListener('pointermove', function (e) {
        if (!pulling) return;
        const p = worldFromEvent(e);
        const dx = p.x - PAD.x;
        const dy = p.y - PAD.y;
        const d = Math.hypot(dx, dy) || 1;
        const max = 150;
        const k = Math.min(max, d) / d;
        pull = { x: PAD.x + dx * k, y: PAD.y + dy * k };
        aim = Math.atan2(PAD.y - pull.y, PAD.x - pull.x);
        power = Math.min(460, Math.hypot(PAD.x - pull.x, PAD.y - pull.y) * 2.35);
      });
      function release(e) {
        if (!pulling) return;
        pulling = false;
        fireFrom(pull);
      }
      canvas.addEventListener('pointerup', release);
      canvas.addEventListener('pointercancel', function () { pulling = false; });

      window.addEventListener('keydown', function (e) {
        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].indexOf(e.code) >= 0) e.preventDefault();
        if ((e.code === 'Enter' || e.code === 'Space') && (state === 'title' || state === 'done')) {
          start();
          return;
        }
        if (state !== 'aim') return;
        if (e.code === 'ArrowLeft') aim -= 0.06;
        if (e.code === 'ArrowRight') aim += 0.06;
        if (e.code === 'ArrowUp') power = Math.min(460, power + 14);
        if (e.code === 'ArrowDown') power = Math.max(80, power - 14);
        if (e.code === 'Space') {
          fireFrom({
            x: PAD.x - Math.cos(aim) * (power / 2.35),
            y: PAD.y - Math.sin(aim) * (power / 2.35)
          });
        }
      });

      function step(dt) {
        if (state !== 'flight' || !pebble) return;
        const sub = 4;
        const sdt = dt / sub;
        for (let s = 0; s < sub; s++) {
          const a = accel(pebble.x, pebble.y);
          pebble.vx += a.x * sdt;
          pebble.vy += a.y * sdt;
          const prevX = pebble.x;
          const prevY = pebble.y;
          pebble.x += pebble.vx * sdt;
          pebble.y += pebble.vy * sdt;
          pebble.t += sdt;
          for (let i = 0; i < hoops.length; i++) {
            const h = hoops[i];
            if (h.got) continue;
            const prev = Math.hypot(prevX - h.x, prevY - h.y);
            const now = Math.hypot(pebble.x - h.x, pebble.y - h.y);
            if (prev > h.r && now <= h.r) {
              h.got = true;
              pebble.scored += 1;
              score += 150;
              tone(680, 0.1);
              live.textContent = 'Hoop. Score ' + score + '.';
            }
          }
          if (Math.hypot(pebble.x - MOON.x, pebble.y - MOON.y) <= MOON.r + PR) {
            if (pebble.scored >= 2) score += 100;
            paintHud();
            endFlight('moon');
            return;
          }
        }
        trail.push({ x: pebble.x, y: pebble.y });
        if (trail.length > 48) trail.shift();
        const outside = pebble.x < -120 || pebble.x > W + 120 || pebble.y < -120 || pebble.y > H + 120;
        if (outside || pebble.t > 8) {
          if (pebble.scored >= 2) score += 100;
          paintHud();
          endFlight(outside ? 'out' : 'time');
          return;
        }
        paintHud();
        if (gotCount() === hoops.length) {
          if (pebble.scored >= 2) score += 100;
          endFlight('clear');
        }
      }

      function toS(x, y) { return [view.ox + x * view.s, view.oy + y * view.s]; }
      function draw() {
        ctx.clearRect(0, 0, view.w, view.h);
        ctx.fillStyle = '#101010';
        ctx.fillRect(0, 0, view.w, view.h);
        stars.forEach(function (star) {
          ctx.fillStyle = 'rgba(244,239,226,.75)';
          ctx.fillRect((star.x / W) * view.w, (star.y / H) * view.h, star.r, star.r);
        });
        if (state === 'aim' || state === 'title') {
          const pts = preview();
          ctx.beginPath();
          pts.forEach(function (pt, i) {
            const p = toS(pt.x, pt.y);
            if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
          });
          ctx.setLineDash([5, 6]);
          ctx.strokeStyle = 'rgba(216,255,0,.85)';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.setLineDash([]);
        }
        if (trail.length > 1) {
          ctx.beginPath();
          trail.forEach(function (pt, i) {
            const p = toS(pt.x, pt.y);
            if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
          });
          ctx.strokeStyle = 'rgba(244,239,226,.45)';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
        hoops.forEach(function (h) {
          const p = toS(h.x, h.y);
          ctx.beginPath();
          ctx.arc(p[0], p[1], h.r * view.s, 0, Math.PI * 2);
          ctx.lineWidth = 4;
          ctx.strokeStyle = h.got ? '#d8ff00' : 'rgba(244,239,226,.85)';
          ctx.stroke();
        });
        const moon = toS(MOON.x, MOON.y);
        ctx.beginPath();
        ctx.fillStyle = '#1c1e16';
        ctx.arc(moon[0], moon[1], MOON.r * view.s, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#d8ff00';
        ctx.stroke();
        [[-16, -10, 10], [14, 8, 7], [2, 18, 5]].forEach(function (c) {
          ctx.beginPath();
          ctx.fillStyle = '#12140e';
          ctx.arc(moon[0] + c[0] * view.s, moon[1] + c[1] * view.s, c[2] * view.s, 0, Math.PI * 2);
          ctx.fill();
        });
        const flying = state === 'flight' && pebble;
        const anchor = pulling ? pull : {
          x: PAD.x - Math.cos(aim) * Math.min(140, power / 2.35),
          y: PAD.y - Math.sin(aim) * Math.min(140, power / 2.35)
        };
        const stoneWorld = flying ? pebble : (state === 'title' ? { x: PAD.x, y: PAD.y } : anchor);
        const stone = toS(stoneWorld.x, stoneWorld.y);
        if (!flying) {
          const left = toS(PAD.x - 16, PAD.y - 10);
          const right = toS(PAD.x + 16, PAD.y + 12);
          ctx.strokeStyle = '#d8ff00';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(left[0], left[1]);
          ctx.lineTo(stone[0], stone[1]);
          ctx.lineTo(right[0], right[1]);
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.fillStyle = '#f4efe2';
        ctx.arc(stone[0], stone[1], PR * view.s, 0, Math.PI * 2);
        ctx.fill();
        const pad = toS(PAD.x, PAD.y);
        ctx.strokeStyle = 'rgba(216,255,0,.4)';
        ctx.strokeRect(pad[0] - 8, pad[1] - 8, 16, 16);
      }

      freshHoops();
      layout();
      paintHud();
      go.focus();
      let last = performance.now();
      function frame(now) {
        const dt = Math.min(0.033, (now - last) / 1000);
        last = now;
        step(dt);
        draw();
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
      window.addEventListener('resize', layout);
    })();
  </script>
</body>
</html>
