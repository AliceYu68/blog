<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efe9d8">
  <title>Pocket Tilt</title>
  <meta name="description" content="Roll a marble into the acid pocket. A one-file canvas maze.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    html, body { margin: 0; height: 100%; background: #efe9d8; overflow: hidden; touch-action: none; color: #101010; }
    body { font-family: ui-sans-serif, system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    a.brand {
      position: fixed; z-index: 4; top: 12px; left: 14px;
      color: #101010; background: #d8ff00; text-decoration: none;
      font-weight: 700; font-size: 12px; letter-spacing: .04em;
      padding: 7px 9px;
    }
    a.brand:focus-visible, button:focus-visible { outline: 2px solid #101010; outline-offset: 3px; }
    #hud {
      position: fixed; z-index: 4; top: 12px; right: 14px; text-align: right;
      font-weight: 700; font-variant-numeric: tabular-nums;
    }
    #hud b { display: block; font-size: 28px; letter-spacing: -.03em; }
    #hud span { font-size: 13px; }
    #overlay {
      position: fixed; inset: 0; z-index: 6;
      display: grid; place-items: end center; padding: 24px 18px 108px;
      pointer-events: none;
    }
    #overlay[hidden] { display: none; }
    .card {
      pointer-events: auto;
      width: min(460px, 100%);
      background: #fffdf6;
      border: 1px solid #101010;
      padding: 22px 22px 16px;
    }
    .eyebrow { margin: 0 0 6px; letter-spacing: .14em; text-transform: uppercase; font-size: 12px; }
    h1 { margin: 0 0 8px; font-size: clamp(40px, 8vw, 64px); line-height: .95; letter-spacing: -.04em; }
    p { margin: 0 0 8px; line-height: 1.45; }
    button {
      appearance: none; border: 0; cursor: pointer; background: #101010; color: #d8ff00;
      font: 700 16px/1 ui-sans-serif, system-ui, sans-serif;
      padding: 14px 18px; min-height: 48px; margin: 8px 8px 0 0;
    }
    button.ghost { background: transparent; color: #101010; border: 1px solid #101010; }
    .links a { color: #101010; }
    .pad {
      position: fixed; z-index: 5; right: 14px; bottom: 14px;
      display: grid; grid-template-columns: 54px 54px 54px; grid-template-rows: 54px 54px 54px; gap: 6px;
    }
    .pad button { margin: 0; padding: 0; min-height: 0; background: #fffdf6; color: #101010; border: 1px solid #101010; font-size: 18px; }
    .pad button.on, .pad button:active { background: #d8ff00; }
    .pad .up { grid-area: 1 / 2; }
    .pad .left { grid-area: 2 / 1; }
    .pad .right { grid-area: 2 / 3; }
    .pad .down { grid-area: 3 / 2; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    @media (max-width: 640px) {
      .pad { grid-template-columns: 48px 48px 48px; grid-template-rows: 48px 48px 48px; }
      #overlay { padding-bottom: 96px; }
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <a class="brand" href="https://vectoree.ai">Built with Vectoree</a>
  <div id="hud"><b id="level">1 / 3</b><span id="meta">0.0s · 0 falls</span></div>
  <div class="pad">
    <button class="up" type="button" aria-label="Tilt up">▲</button>
    <button class="left" type="button" aria-label="Tilt left">◀</button>
    <button class="right" type="button" aria-label="Tilt right">▶</button>
    <button class="down" type="button" aria-label="Tilt down">▼</button>
  </div>
  <div id="overlay">
    <div class="card">
      <p class="eyebrow">Three pockets</p>
      <h1 id="title">Pocket Tilt</h1>
      <p id="blurb">Roll the marble into the acid pocket. Holes send you back to the start of that maze.</p>
      <p>Arrow keys or WASD, the pad, or tilt after you allow it.</p>
      <button id="go" type="button">Roll</button>
      <button id="tilt" class="ghost" type="button">Use tilt</button>
      <p class="links"><a href="/games/">All games</a> · <a href="/posts/pocket-tilt-one-file-browser-game/">How it was built</a></p>
    </div>
  </div>
  <p id="live" class="sr" aria-live="polite"></p>
  <script>
    (function () {
      const LEVELS = [
        [
          '########',
          '#S     #',
          '# #### #',
          '# #  # #',
          '# # ## #',
          '# #    #',
          '# #### #',
          '#o    G#',
          '########'
        ],
        [
          '##########',
          '#S       #',
          '# ## ### #',
          '# #  # # #',
          '# # ## # #',
          '# #    # #',
          '# #### # #',
          '#o     #G#',
          '##########'
        ],
        [
          '############',
          '#S         #',
          '# ### #### #',
          '# #   #  # #',
          '# # # # ## #',
          '# # #   #  #',
          '# # ##### o#',
          '# #      # #',
          '# ##### ## #',
          '#o        G#',
          '############'
        ]
      ];
      const BEST_KEY = 'vectoree-pocket-tilt-best';
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      const overlay = document.getElementById('overlay');
      const go = document.getElementById('go');
      const tiltBtn = document.getElementById('tilt');
      const blurb = document.getElementById('blurb');
      const title = document.getElementById('title');
      const levelEl = document.getElementById('level');
      const metaEl = document.getElementById('meta');
      const live = document.getElementById('live');

      const key = { x: 0, y: 0 };
      const pad = { x: 0, y: 0 };
      const held = { l: false, r: false, u: false, d: false };
      let tiltOn = false;
      let tiltX = 0;
      let tiltY = 0;
      let state = 'title';
      let levelIndex = 0;
      let walls = [];
      let holes = [];
      let start = { x: 1.5, y: 1.5 };
      let goal = { x: 2.5, y: 2.5 };
      let cols = 8;
      let rows = 9;
      let ball = { x: 1.5, y: 1.5, vx: 0, vy: 0 };
      let falls = 0;
      let time = 0;
      let wait = 0;
      let cell = 48;
      let ox = 0;
      let oy = 0;
      let audio;

      function parse(lines) {
        cols = lines[0].length;
        rows = lines.length;
        walls = [];
        holes = [];
        lines.forEach(function (line, y) {
          for (let x = 0; x < line.length; x++) {
            const ch = line[x];
            if (ch === '#') walls.push({ x: x, y: y, w: 1, h: 1 });
            else if (ch === 'o') holes.push({ x: x + 0.5, y: y + 0.5 });
            else if (ch === 'S') start = { x: x + 0.5, y: y + 0.5 };
            else if (ch === 'G') goal = { x: x + 0.5, y: y + 0.5 };
          }
        });
      }
      function spawn() {
        ball.x = start.x;
        ball.y = start.y;
        ball.vx = 0;
        ball.vy = 0;
      }
      function loadLevel(i) {
        levelIndex = i;
        parse(LEVELS[i]);
        spawn();
        levelEl.textContent = (i + 1) + ' / ' + LEVELS.length;
      }
      function readBest() {
        try { return Number(localStorage.getItem(BEST_KEY) || 0); } catch (e) { return 0; }
      }
      function writeBest(n) {
        try { if (!n) return; localStorage.setItem(BEST_KEY, String(n)); } catch (e) { /* ignore */ }
      }
      function tone(freq) {
        try {
          audio = audio || new AudioContext();
          if (audio.state === 'suspended') audio.resume();
          const o = audio.createOscillator();
          const g = audio.createGain();
          o.type = 'sine';
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.04, audio.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.1);
          o.connect(g); g.connect(audio.destination);
          o.start(); o.stop(audio.currentTime + 0.11);
        } catch (e) { /* optional */ }
      }
      function layout() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = window.innerWidth;
        const h = window.innerHeight;
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const margin = 16;
        const top = 72;
        const bottom = 196;
        cell = Math.max(18, Math.floor(Math.min((w - margin * 2) / cols, (h - top - bottom) / rows)));
        ox = Math.floor((w - cell * cols) / 2);
        oy = Math.floor(top + Math.max(0, (h - top - bottom - cell * rows) / 2));
      }
      function syncKeys() {
        key.x = (held.r ? 1 : 0) - (held.l ? 1 : 0);
        key.y = (held.d ? 1 : 0) - (held.u ? 1 : 0);
      }
      function inputAxes() {
        let x = key.x + pad.x;
        let y = key.y + pad.y;
        if (tiltOn && x === 0 && y === 0) {
          x = tiltX;
          y = tiltY;
        }
        return {
          x: Math.max(-1, Math.min(1, x)),
          y: Math.max(-1, Math.min(1, y))
        };
      }
      function resolve(b) {
        const r = 0.27;
        for (let n = 0; n < walls.length; n++) {
          const rect = walls[n];
          const nx = Math.max(rect.x, Math.min(b.x, rect.x + rect.w));
          const ny = Math.max(rect.y, Math.min(b.y, rect.y + rect.h));
          let dx = b.x - nx;
          let dy = b.y - ny;
          const d2 = dx * dx + dy * dy;
          if (d2 > r * r) continue;
          if (d2 === 0) {
            const left = b.x - rect.x;
            const right = rect.x + rect.w - b.x;
            const top = b.y - rect.y;
            const bottom = rect.y + rect.h - b.y;
            const min = Math.min(left, right, top, bottom);
            if (min === left) { b.x = rect.x - r; b.vx = Math.min(0, b.vx); }
            else if (min === right) { b.x = rect.x + rect.w + r; b.vx = Math.max(0, b.vx); }
            else if (min === top) { b.y = rect.y - r; b.vy = Math.min(0, b.vy); }
            else { b.y = rect.y + rect.h + r; b.vy = Math.max(0, b.vy); }
            continue;
          }
          const d = Math.sqrt(d2);
          dx /= d; dy /= d;
          const pen = r - d;
          b.x += dx * pen;
          b.y += dy * pen;
          const vn = b.vx * dx + b.vy * dy;
          if (vn < 0) {
            b.vx -= vn * dx;
            b.vy -= vn * dy;
          }
        }
      }
      function paintHud() {
        metaEl.textContent = time.toFixed(1) + 's · ' + falls + ' fall' + (falls === 1 ? '' : 's');
      }
      function show(titleText, body, button) {
        title.textContent = titleText;
        blurb.textContent = body;
        go.textContent = button;
        overlay.hidden = false;
        go.focus();
      }
      function hide() { overlay.hidden = true; }
      function begin() {
        levelIndex = 0;
        falls = 0;
        time = 0;
        loadLevel(0);
        state = 'play';
        hide();
        live.textContent = 'Maze 1.';
        try { audio = audio || new AudioContext(); if (audio.state === 'suspended') audio.resume(); } catch (e) {}
      }
      function win() {
        state = 'done';
        const best = readBest();
        const stamp = Math.round(time * 10) / 10;
        if (!best || stamp < best) writeBest(stamp);
        const bestNow = !best || stamp < best ? stamp : best;
        show('Pocketed', 'Three mazes in ' + stamp.toFixed(1) + 's with ' + falls + ' falls. Best ' + bestNow.toFixed(1) + 's.', 'Roll again');
        live.textContent = 'Finished in ' + stamp.toFixed(1) + ' seconds.';
        tone(880);
      }

      go.addEventListener('click', function () {
        if (state === 'play') return;
        begin();
      });
      tiltBtn.addEventListener('click', function () {
        const Doe = window.DeviceOrientationEvent;
        if (Doe && typeof Doe.requestPermission === 'function') {
          Doe.requestPermission().then(function (res) {
            tiltOn = res === 'granted';
            tiltBtn.textContent = tiltOn ? 'Tilt on' : 'Tilt blocked';
          }).catch(function () { tiltBtn.textContent = 'Tilt blocked'; });
        } else {
          tiltOn = true;
          tiltBtn.textContent = 'Tilt on';
        }
      });
      window.addEventListener('deviceorientation', function (e) {
        if (!tiltOn || e.gamma == null) return;
        tiltX = Math.max(-1, Math.min(1, e.gamma / 22));
        tiltY = Math.max(-1, Math.min(1, ((e.beta || 0) - 45) / 28));
      });
      window.addEventListener('keydown', function (e) {
        const map = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd' };
        if (map[e.code]) { held[map[e.code]] = true; syncKeys(); e.preventDefault(); }
        if ((e.code === 'Enter' || e.code === 'Space') && state !== 'play') { e.preventDefault(); begin(); }
      });
      window.addEventListener('keyup', function (e) {
        const map = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd' };
        if (map[e.code]) { held[map[e.code]] = false; syncKeys(); e.preventDefault(); }
      });
      window.addEventListener('blur', function () {
        held.l = held.r = held.u = held.d = false;
        syncKeys();
        pad.x = 0; pad.y = 0;
      });
      document.querySelectorAll('.pad button').forEach(function (btn) {
        const dir = btn.classList.contains('left') ? ['x', -1]
          : btn.classList.contains('right') ? ['x', 1]
          : btn.classList.contains('up') ? ['y', -1]
          : ['y', 1];
        btn.addEventListener('pointerdown', function (e) {
          e.preventDefault();
          btn.setPointerCapture(e.pointerId);
          pad[dir[0]] = dir[1];
          btn.classList.add('on');
        });
        function clear() {
          if (pad[dir[0]] === dir[1]) pad[dir[0]] = 0;
          btn.classList.remove('on');
        }
        btn.addEventListener('pointerup', clear);
        btn.addEventListener('pointercancel', clear);
      });

      function step(dt) {
        if (state !== 'play') return;
        if (wait > 0) { wait -= dt; return; }
        time += dt;
        const a = inputAxes();
        ball.vx += a.x * 16 * dt;
        ball.vy += a.y * 16 * dt;
        const drag = Math.exp(-3.1 * dt);
        ball.vx *= drag;
        ball.vy *= drag;
        const max = 6.5;
        const sp = Math.hypot(ball.vx, ball.vy);
        if (sp > max) { ball.vx = ball.vx / sp * max; ball.vy = ball.vy / sp * max; }
        const sub = 5;
        const sdt = dt / sub;
        let fell = false;
        for (let s = 0; s < sub; s++) {
          ball.x += ball.vx * sdt;
          ball.y += ball.vy * sdt;
          resolve(ball);
          for (let h = 0; h < holes.length; h++) {
            if (Math.hypot(ball.x - holes[h].x, ball.y - holes[h].y) < 0.28) fell = true;
          }
          if (fell) break;
        }
        if (fell) {
          falls += 1;
          spawn();
          wait = 0.25;
          tone(180);
          live.textContent = 'Fell. Back to the start.';
        } else if (Math.hypot(ball.x - goal.x, ball.y - goal.y) < 0.32) {
          tone(740);
          if (levelIndex + 1 >= LEVELS.length) win();
          else {
            loadLevel(levelIndex + 1);
            wait = 0.35;
            live.textContent = 'Maze ' + (levelIndex + 1) + '.';
          }
        }
        paintHud();
      }

      function draw() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#efe9d8';
        ctx.fillRect(0, 0, w, h);
        ctx.save();
        ctx.translate(ox, oy);
        ctx.scale(cell, cell);
        ctx.fillStyle = '#f7f3e6';
        ctx.fillRect(0, 0, cols, rows);
        holes.forEach(function (hole) {
          ctx.beginPath();
          ctx.fillStyle = '#17170f';
          ctx.arc(hole.x, hole.y, 0.34, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.strokeStyle = '#3a3428';
          ctx.lineWidth = 0.04;
          ctx.arc(hole.x, hole.y, 0.22, 0, Math.PI * 2);
          ctx.stroke();
        });
        ctx.beginPath();
        ctx.strokeStyle = '#d8ff00';
        ctx.lineWidth = 0.08;
        ctx.arc(goal.x, goal.y, 0.32, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.fillStyle = '#d8ff00';
        ctx.arc(goal.x, goal.y, 0.08, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#17170f';
        walls.forEach(function (rect) { ctx.fillRect(rect.x, rect.y, rect.w, rect.h); });
        ctx.fillStyle = '#d8ff00';
        walls.forEach(function (rect) {
          const above = walls.some(function (other) { return other.x === rect.x && other.y === rect.y - 1; });
          if (!above) ctx.fillRect(rect.x, rect.y, rect.w, 0.045);
        });
        ctx.beginPath();
        ctx.fillStyle = '#f4efe2';
        ctx.strokeStyle = '#101010';
        ctx.lineWidth = 0.04;
        ctx.arc(ball.x, ball.y, 0.27, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.fillStyle = '#ffffff';
        ctx.arc(ball.x - 0.08, ball.y - 0.08, 0.07, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      loadLevel(0);
      layout();
      paintHud();
      go.focus();
      let last = performance.now();
      function frame(now) {
        requestAnimationFrame(frame);
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        step(dt);
        draw();
      }
      requestAnimationFrame(frame);
      window.addEventListener('resize', layout);
    })();
  </script>
</body>
</html>
